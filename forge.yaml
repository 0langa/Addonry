name: addonry
version: 0.3.0
description: Manual-only tri-client plugin for acceptance-driven Chrome and Firefox
  extension development, repair-loop verification, and local packaging.
providers:
- claude
- codex
- kimi
surfaces:
  skills:
  - name: create-chrome-extension
    path: skills/create-chrome-extension/SKILL.md
    providers:
    - codex
    - kimi
  commands:
  - name: create-chrome-extension
    path: commands/create-chrome-extension.md
    providers:
    - claude
    - kimi
  agents: []
  hooks: []
  mcp:
  - name: addonry-chrome-devtools
    transport: stdio
    package: powershell.exe
    env: []
    args:
    - -NoLogo
    - -NoProfile
    - -NonInteractive
    - -ExecutionPolicy
    - Bypass
    - -Command
    - $roots = @($env:CLAUDE_PLUGIN_ROOT, $env:KIMI_PLUGIN_ROOT, $env:PLUGIN_ROOT,
      (Get-Location).Path) | Where-Object { $_ }; $root = $roots | Where-Object {
      Test-Path -LiteralPath (Join-Path $_ 'scripts/start-chrome-devtools-mcp.ps1')
      } | Select-Object -First 1; if (-not $root) { throw 'Addonry plugin root not
      found.' }; & (Join-Path $root 'scripts/start-chrome-devtools-mcp.ps1')
install:
  claude: ~/.claude/plugins/addonry/
  codex: ~/.codex/plugins/addonry/
  kimi: ~/.kimi-code/plugins/managed/addonry/
settings_patches: {}
marketplace: {}
metadata:
  author: 0langa
  license: MIT
  homepage: https://github.com/0langa/Addonry
  repository: https://github.com/0langa/Addonry
  keywords:
  - chrome
  - firefox
  - browser-extension
  - manifest-v3
  - automation
  - testing
  - packaging
  - quality-loop
  - traceability
  skill_instructions: Addonry is manual-only. Use its workflow and addonry-chrome-devtools
    MCP tools only after the user explicitly runs the provider's create-chrome-extension
    skill or command, or explicitly names Addonry for browser extension creation.
  interface:
    display_name: Addonry
    short_description: Build browser extensions through proof-driven repair loops
    long_description: Turns an explicit extension request into a confirmed acceptance
      contract and scoped Manifest V3 project for Chrome, Firefox, or both; repairs
      gaps until each criterion has current browser/package proof.
    developer_name: 0langa
    category: Productivity
    capabilities:
    - Browser
    - Automation
    - Write
    - Packaging
    - Quality Assurance
    default_prompt:
    - $addonry:create-chrome-extension Build my personal Chrome and Firefox extension
      and repair gaps until every confirmed criterion has current proof.
    - $addonry:create-chrome-extension Build this browser utility for both browsers
      and package unsigned ZIPs when ready.
    brand_color: '#7C3AED'
provider_extras:
  claude: {}
  codex: {}
  kimi: {}
options:
  shared_mcp_file: false
